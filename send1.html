<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' https://tssc13th.github.io data:;">

    <title> 匿名意見投遞 - TSSC13TH 胡台校意見箱</title>
    <link rel="icon" type="image/png" href="tsscblack.png">
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
        }

        .navbar {
            width: 100%;             
            background-color: #ffffff;
            border-bottom: 1px solid #e5e7eb; 
            padding: 0.8rem 0;
            box-shadow: none;       
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between; 
            align-items: center;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #111827;
            font-weight: 700;
            font-size: 1.15rem;
            gap: 10px;
        }

        .site-logo {
            height: 32px;
            width: auto;
            object-fit: contain;
            vertical-align: middle;
            filter: brightness(0);
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-pill-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            padding: 0.45rem 0.9rem;
            font-size: 0.88rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s ease;
            cursor: pointer;
            background-color: #f8fafc;
            color: #475569;
            border: 1px solid #e2e8f0;
        }

        .nav-pill-btn:hover {
            background-color: #f1f5f9;
            color: #1e293b;
            border-color: #cbd5e1;
        }

        .nav-pill-btn.active {
            background-color: #eff6ff;
            color: #2563eb;
            border-color: #bfdbfe;
        }

        .hamburger-btn, .close-drawer-btn, .drawer-overlay {
            display: none;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #1e293b;
        }
        .form-group input[type="text"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #2563eb;
        }
        .submit-btn {
            width: 100%;
            background: black;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .submit-btn:hover {
            background: #000;
        }
        .submit-btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        @media screen and (max-width: 768px) {
            .navbar .nav-container {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 16px;
                position: relative;
            }

            .hamburger-btn {
                display: inline-flex !important;
                align-items: center;
                justify-content: center;
                background: transparent;
                border: none;
                font-size: 1.5rem;
                color: #1e293b;
                cursor: pointer;
                padding: 4px;
            }

            .navbar .nav-brand {
                font-size: 0.95rem;
                gap: 6px;
                flex: 1;
                margin-left: 10px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .navbar .site-logo {
                width: 32px;
                height: auto;
            }

            .nav-menu, .nav-links {
                position: fixed;
                top: 0;
                left: -280px;
                width: 260px;
                height: 100vh;
                background-color: #ffffff !important;
                box-shadow: 4px 0 15px rgba(0, 0, 0, 0.15);
                z-index: 2000 !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: flex-start !important;
                align-items: stretch !important;
                padding: 20px !important;
                gap: 12px !important;
                transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .nav-menu.open, .nav-links.open {
                left: 0 !important;
            }

            .drawer-header {
                display: flex !important;
                justify-content: space-between !important;
                align-items: center !important;
                padding-bottom: 12px;
                margin-bottom: 8px;
                border-bottom: 1px solid #e2e8f0;
                width: 100%;
            }

            .drawer-title {
                font-size: 1.1rem;
                font-weight: 700;
                color: #1e293b;
            }

            .close-drawer-btn {
                display: block !important;
                position: static !important;
                background: transparent;
                border: none;
                font-size: 1.4rem;
                color: #64748b;
                cursor: pointer;
                padding: 2px 6px;
            }

            .nav-menu .nav-pill-btn, .nav-links .nav-item {
                width: 100% !important;
                display: flex !important;
                text-align: left !important;
                padding: 12px 16px !important;
                font-size: 1rem !important;
                justify-content: flex-start !important;
                color: #475569 !important;
                background-color: #f8fafc !important;
                border: 1px solid #e2e8f0 !important;
                border-radius: 8px !important;
                white-space: nowrap;
                cursor: pointer !important;
                text-decoration: none;
            }

            .nav-menu .nav-pill-btn.active, .nav-links .nav-item.active {
                background-color: #eff6ff !important;
                color: #2563eb !important;
                border-color: #bfdbfe !important;
            }

            .container, .admin-header-bar, #admin-dashboard {
                padding: 0 12px;
                margin: 10px auto 20px;
            }

            .feedback-form, .form-card, .card, .login-card, .info-section {
                padding: 20px 16px;
                border-radius: 12px;
                margin: 10px auto;
            }

            .form-group input,
            .form-group select,
            .form-group textarea {
                font-size: 16px !important; 
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    
    <nav class="navbar">
        <div class="nav-container">
            <button class="hamburger-btn" onclick="toggleDrawer()" aria-label="開啟選單">
                ☰
            </button>

            <a href="index.html" class="nav-brand">
                <img src="tpshcmcsc.png" alt="會徽" class="site-logo">
                <span class="brand-text">TSSC13TH 胡台校意見箱</span>
            </a>

            <div class="nav-menu" id="navDrawer">
                <div class="drawer-header">
                    <span class="drawer-title">TSSC意見箱</span>
                    <button type="button" class="close-drawer-btn" onclick="toggleDrawer()" aria-label="關閉選單">✕</button>
                </div>
                <a href="index.html" class="nav-pill-btn">首頁與須知</a>
                <a href="replies.html" class="nav-pill-btn">匿名回覆專區</a>
                <a href="myreplies.html" class="nav-pill-btn">我的實名回覆</a>
            </div>
        </div>
    </nav>

    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>

    <header class="hero-header" style="text-align: center; padding: 30px 20px 10px;">
        <h1 style="color: #1e293b; margin-top: 5px;"> 匿名意見投遞</h1>
        <p style="color: #64748b; margin-top: 6px;">無需填寫個人資料，您的意見將以完全匿名的方式提交給學生會</p>
    </header>

    <main class="container" style="display: block; max-width: 600px; margin: 20px auto; padding: 0 20px;">
        <form id="anonymousForm" class="form-card">
            <div class="form-group">
                <label for="assignee">指定處理人員 / 部門（選填）：</label>
                <input type="text" id="assignee" placeholder="例如：會長、活動組（若無指定可留空）">
            </div>

            <div class="form-group">
                <label for="category">意見類別：</label>
                <select id="category" required>
                    <option value="" disabled selected>請選擇類別</option>
                    <option value="活動建議">活動建議</option>
                    <option value="校園設施">校園設施</option>
                    <option value="規範權益">規範權益</option>
                    <option value="其他">其他</option>
                </select>
            </div>

            <div class="form-group">
                <label for="content">意見內容：</label>
                <textarea id="content" rows="5" required placeholder="在此輸入您想反映的內容..."></textarea>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">確認送出</button>
        </form>
    </main>

    <footer style="text-align: center; padding: 20px; color: #94a3b8; font-size: 0.88rem;">
        <p>胡志明市台灣學校學生會 TSSC13TH © 2026 yucheng</p>
    </footer>

    <script>
        function toggleDrawer() {
            const drawer = document.getElementById('navDrawer');
            if (drawer) {
                drawer.classList.toggle('open');
            }
        }

        document.addEventListener('click', function(event) {
            const drawer = document.getElementById('navDrawer');
            const hamburgerBtn = document.querySelector('.hamburger-btn');

            if (drawer && drawer.classList.contains('open')) {
                if (!drawer.contains(event.target) && !hamburgerBtn.contains(event.target)) {
                    drawer.classList.remove('open');
                }
            }
        });

        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzXm5TiQss1GUKkDF4TOZJMqAeraA63vrpecSEzAuIvcNOvGjF51HFWnNutWc1Mjx4f/exec';
        let statusInterval = null;

        function checkSystemStatus() {
            fetch(`${GAS_URL}?action=checkLockStatus&_t=${Date.now()}`)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP 錯誤 Status: ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    if (data && typeof data.locked !== 'undefined') {
                        if (data.locked === true) {
                            if (statusInterval) clearInterval(statusInterval);
                            window.location.href = 'lock.html';
                        } else if (data.maintenance === true) {
                            if (statusInterval) clearInterval(statusInterval);
                            window.location.href = 'maintenance.html';
                        }
                    }
                })
                .catch(err => {
                    console.warn('檢測連線波動，維持現狀:', err.message);
                });
        }

        window.onload = function() {
            checkSystemStatus();
            statusInterval = setInterval(checkSystemStatus, 10000); 
        };

        document.getElementById('anonymousForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const assigneeVal = document.getElementById('assignee').value.trim();
            const contentVal = document.getElementById('content').value.trim();

            if (!contentVal) {
                alert('請輸入意見內容！');
                return;
            }

            const clientInfo = navigator.userAgent;

            const formData = {
                action: 'addFeedback',
                type: 'anonymous',
                name: '匿名',
                class_name: '',
                email: '',
                target_assignee: assigneeVal === '' ? '學生會' : assigneeVal,
                assignee: assigneeVal === '' ? '學生會' : assigneeVal,
                category: document.getElementById('category').value,
                content: contentVal,
                clientInfo: clientInfo
            };

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = '處理中，請稍候...';

            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(formData)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('意見已成功匿名送出！');
                    document.getElementById('anonymousForm').reset();
                    window.location.href = 'replies.html';
                } else {
                    alert('送出失敗：' + (data.error || '未知錯誤'));
                }
            })
            .catch(err => {
                console.error(err);
                alert('連線發生錯誤，請稍後再試！');
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = '確認送出';
            });
        });
    </script>
</body>
</html>
