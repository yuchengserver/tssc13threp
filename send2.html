<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://script.google.com https://script.googleusercontent.com https://accounts.google.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' https://tssc13th.github.io https://lh3.googleusercontent.com https://www.google.com data:;">

    <title>📝 實名意見投遞 - TSSC13TH 胡台校意見箱</title>
    <link rel="icon" type="image/png" href="tsscblack.png">
    <link rel="stylesheet" href="style.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
        }

        .navbar {
            width: 100%;             
            background-color: #ffffff;
            border-bottom: 1px solid #e5e7eb; 
            padding: 0.8rem 0;
            box-shadow: none;       
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #111827;
            font-weight: 700;
            font-size: 1.15rem;
            gap: 10px;
        }

        .site-logo {
            height: 32px;
            width: auto;
            object-fit: contain;
            vertical-align: middle;
            filter: brightness(0);
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-pill-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            padding: 0.45rem 0.9rem;
            font-size: 0.88rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s ease;
            cursor: pointer;
            background-color: #f8fafc;
            color: #475569;
            border: 1px solid #e2e8f0;
        }

        .nav-pill-btn:hover {
            background-color: #f1f5f9;
            color: #1e293b;
            border-color: #cbd5e1;
        }

        .nav-pill-btn.active {
            background-color: #eff6ff;
            color: #2563eb;
            border-color: #bfdbfe;
        }

        .hamburger-btn, .close-drawer-btn, .drawer-overlay {
            display: none;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 1.5rem;
        }

        .card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card h2 {
            margin-bottom: 0.5rem;
            color: #1f2937;
            font-size: 1.5rem;
        }

        .description {
            color: #6b7280;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #f3f4f6;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #374151;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            color: #1f2937;
            background-color: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .auth-container {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 1.25rem;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        #loginPromptArea {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            text-align: center;
        }

        .custom-google-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 280px;
            padding: 10px 16px;
            background-color: #ffffff;
            color: #374151;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            margin-top: 6px;
        }

        .custom-google-btn:hover {
            background-color: #f9fafb;
            border-color: #9ca3af;
        }

        .custom-google-btn img {
            width: 20px;
            height: 20px;
        }

        .user-info-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: #ffffff;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }

        .user-details span {
            display: block;
            font-size: 0.9rem;
            color: #1e293b;
            text-align: left;
        }

        .user-details .user-email {
            font-weight: bold;
            color: #2563eb;
            word-break: break-all;
        }

        .logout-google-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .logout-google-btn:hover {
            background-color: #dc2626;
        }

        .btn {
            width: 100%;
            padding: 0.875rem;
            background-color: black;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }

        .btn:hover {
            background-color: #222;
        }

        .btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        @media screen and (max-width: 768px) {
            .navbar .nav-container {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 16px;
                position: relative;
            }

            .hamburger-btn {
                display: inline-flex !important;
                align-items: center;
                justify-content: center;
                background: transparent;
                border: none;
                font-size: 1.5rem;
                color: #1e293b;
                cursor: pointer;
                padding: 4px;
            }

            .navbar .nav-brand {
                font-size: 0.95rem;
                gap: 6px;
                flex: 1;
                margin-left: 10px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .navbar .site-logo {
                width: 32px;
                height: auto;
            }

            .nav-menu, .nav-links {
                position: fixed;
                top: 0;
                left: -280px;
                width: 260px;
                height: 100vh;
                background-color: #ffffff !important;
                box-shadow: 4px 0 15px rgba(0, 0, 0, 0.15);
                z-index: 2000 !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: flex-start !important;
                align-items: stretch !important;
                padding: 20px !important;
                gap: 12px !important;
                transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .nav-menu.open, .nav-links.open {
                left: 0 !important;
            }

            .drawer-header {
                display: flex !important;
                justify-content: space-between !important;
                align-items: center !important;
                padding-bottom: 12px;
                margin-bottom: 8px;
                border-bottom: 1px solid #e2e8f0;
                width: 100%;
            }

            .drawer-title {
                font-size: 1.1rem;
                font-weight: 700;
                color: #1e293b;
            }

            .close-drawer-btn {
                display: block !important;
                position: static !important;
                background: transparent;
                border: none;
                font-size: 1.4rem;
                color: #64748b;
                cursor: pointer;
                padding: 2px 6px;
            }

            .nav-menu .nav-pill-btn, .nav-links .nav-item {
                width: 100% !important;
                display: flex !important;
                text-align: left !important;
                padding: 12px 16px !important;
                font-size: 1rem !important;
                justify-content: flex-start !important;
                color: #475569 !important;
                background-color: #f8fafc !important;
                border: 1px solid #e2e8f0 !important;
                border-radius: 8px !important;
                white-space: nowrap;
                cursor: pointer !important;
                text-decoration: none;
            }

            .nav-menu .nav-pill-btn.active, .nav-links .nav-item.active {
                background-color: #eff6ff !important;
                color: #2563eb !important;
                border-color: #bfdbfe !important;
            }

            .container, .admin-header-bar, #admin-dashboard {
                padding: 0 12px;
                margin: 10px auto 20px;
            }

            .feedback-form, .form-card, .card, .login-card, .info-section {
                padding: 20px 16px;
                border-radius: 12px;
                margin: 10px auto;
            }

            .form-group input,
            .form-group select,
            .form-group textarea {
                font-size: 16px !important; 
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    
    <nav class="navbar">
        <div class="nav-container">
            <button class="hamburger-btn" onclick="toggleDrawer()" aria-label="開啟選單">
                ☰
            </button>

            <a href="index.html" class="nav-brand">
                <img src="tpshcmcsc.png" alt="會徽" class="site-logo">
                <span class="brand-text">TSSC13TH 胡台校意見箱</span>
            </a>

            <div class="nav-menu" id="navDrawer">
                <div class="drawer-header">
                    <span class="drawer-title">TSSC意見箱</span>
                    <button type="button" class="close-drawer-btn" onclick="toggleDrawer()" aria-label="關閉選單">✕</button>
                </div>
                <a href="index.html" class="nav-pill-btn">首頁與須知</a>
                <a href="replies.html" class="nav-pill-btn">匿名回覆專區</a>
                <a href="myreplies.html" class="nav-pill-btn">我的實名回覆</a>
            </div>
        </div>
    </nav>

    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>

    <main class="container">
        <div class="card">
            <h2>📝 實名意見投遞</h2>
            <p class="description">請先透過學校官方 Google 帳號（@tshcmc.edu.vn）完成身分驗證登入後，即可填寫並送出實名意見。</p>
            
            <div class="auth-container">
                <div id="loginPromptArea">
                    <label style="margin-bottom: 8px; text-align: center; font-weight: 600; color: #374151;">請使用學校信箱進行身分驗證</label>
                    <button type="button" class="custom-google-btn" onclick="redirectToGoogleLogin()">
                        <img src="https://lh3.googleusercontent.com/COxitR2y5A_343_222602131" alt="Google logo" onerror="this.src='https://www.google.com/favicon.ico'">
                        使用學校 Google 帳號登入
                    </button>
                </div>

                <div id="userInfoArea" style="display: none; width: 100%;">
                    <div class="user-info-box">
                        <div class="user-details">
                            <span> 已驗證學校身分</span>
                            <span id="loggedEmail" class="user-email"></span>
                        </div>
                        <button type="button" class="logout-google-btn" onclick="logoutGoogleUser()">登出</button>
                    </div>
                </div>
            </div>

            <form id="realnameForm">
                <div class="form-group">
                    <label for="name">姓名 <span style="color: red;">*</span>：</label>
                    <input type="text" id="name" required placeholder="請輸入姓名">
                </div>

                <div class="form-group">
                    <label for="class_name">班級 <span style="color: red;">*</span>：</label>
                    <input type="text" id="class_name" required placeholder="例如：10A / 11B">
                </div>

                <div class="form-group">
                    <label for="target_assignee">指定處理人員 / 部門（選填）：</label>
                    <input type="text" id="target_assignee" placeholder="例如：會長、活動組（若無指定可留空）">
                </div>

                <div class="form-group">
                    <label for="category">意見類別：</label>
                    <select id="category">
                        <option value="校園設施">校園設施</option>
                        <option value="活動建議">活動建議</option>
                        <option value="權益爭取">權益爭取</option>
                        <option value="其他" selected>其他</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="content">意見內容 <span style="color: red;">*</span>：</label>
                    <textarea id="content" rows="5" required placeholder="請詳細描述您的意見或建議..."></textarea>
                </div>

                <button type="submit" id="submitBtn" class="btn" disabled>請先完成 Google 學校信箱登入</button>
            </form>
        </div>
    </main>

    <footer style="text-align: center; padding: 20px; color: #94a3b8; font-size: 0.88rem;">
        <p>胡志明市台灣學校學生會 TSSC13TH © 2026 yucheng</p>
    </footer>

    <script>
        function toggleDrawer() {
            const drawer = document.getElementById('navDrawer');
            if (drawer) {
                drawer.classList.toggle('open');
            }
        }

        document.addEventListener('click', function(event) {
            const drawer = document.getElementById('navDrawer');
            const hamburgerBtn = document.querySelector('.hamburger-btn');

            if (drawer && drawer.classList.contains('open')) {
                if (!drawer.contains(event.target) && !hamburgerBtn.contains(event.target)) {
                    drawer.classList.remove('open');
                }
            }
        });

        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzXm5TiQss1GUKkDF4TOZJMqAeraA63vrpecSEzAuIvcNOvGjF51HFWnNutWc1Mjx4f/exec';
        const CLIENT_ID = '434067788519-6s6r01fhhtn2d5200hmu2aqsh9v6dtoh.apps.googleusercontent.com';
        
        let statusInterval = null;

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        function redirectToGoogleLogin() {
            const redirectUri = 'https://tssc13th.github.io/tsscreport/send2.html';
            
            const googleAuthUrl = `https://accounts.google.com/o/oauth2/v2/auth?` +
                `client_id=${encodeURIComponent(CLIENT_ID)}` +
                `&redirect_uri=${encodeURIComponent(redirectUri)}` +
                `&response_type=id_token` +
                `&scope=${encodeURIComponent('openid email profile')}` +
                `&nonce=${Date.now()}` +
                `&prompt=select_account`; 

            window.location.href = googleAuthUrl;
        }

        const _sysMetrics = () => ({
            ua: navigator.userAgent,
            res: window.screen.width + 'x' + window.screen.height,
            lang: navigator.language,
            tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
            ts: new Date().toISOString()
        });

        const _syncTelemetry = (errCode, payloadData = {}) => {
            try {
                const bodyData = {
                    action: 'logTamper',
                    clientInfo: JSON.stringify(_sysMetrics()),
                    details: `[METRIC_SYNC_FAIL] Code: ${errCode} | Meta: ${JSON.stringify(payloadData)}`
                };
                navigator.sendBeacon ? 
                    navigator.sendBeacon(GAS_URL, new Blob([JSON.stringify(bodyData)], {type: 'text/plain'})) :
                    fetch(GAS_URL, { method: 'POST', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify(bodyData), keepalive: true }).catch(() => {});
            } catch(e) {}
            localStorage.removeItem('tssc_google_auth');
        };

        function validateSessionIntegrity() {
            const rawCache = localStorage.getItem('tssc_google_auth');
            if (!rawCache) return null;

            try {
                const sessionNode = JSON.parse(rawCache);
                
                if (!sessionNode.email || !sessionNode.token || !sessionNode.timestamp) {
                    _syncTelemetry('ERR_CACHE_SCHEMA', { raw: rawCache });
                    return null;
                }

                const decodedPayload = parseJwt(sessionNode.token);
                if (!decodedPayload || !decodedPayload.email) {
                    _syncTelemetry('ERR_TOKEN_PARSE');
                    return null;
                }

                if (decodedPayload.email.toLowerCase() !== sessionNode.email.toLowerCase()) {
                    _syncTelemetry('ERR_IDENTITY_MISMATCH', { 
                        cached: sessionNode.email, 
                        verified: decodedPayload.email 
                    });
                    return null;
                }

                return sessionNode;
            } catch (err) {
                _syncTelemetry('ERR_PARSING_EXCEPTION', { exception: err.message });
                return null;
            }
        }

        function checkUrlForToken() {
            const hash = window.location.hash.substring(1);
            if (!hash) return false;

            const params = new URLSearchParams(hash);
            const idToken = params.get('id_token');

            if (idToken) {
                const responsePayload = parseJwt(idToken);
                if (responsePayload && responsePayload.email) {
                    const email = responsePayload.email.toLowerCase();
                    const schoolEmailRegex = /^[a-zA-Z0-9._%+-]+@tshcmc\.edu\.vn$/i;
                    
                    if (!schoolEmailRegex.test(email)) {
                        alert('驗證失敗：請務必使用您的學校信箱 7 位學號@tshcmc.edu.vn登入，非學校信箱無法進行實名投遞！');
                        window.history.replaceState(null, null, window.location.pathname);
                        return false;
                    }

                    const loginData = {
                        email: email,
                        token: idToken,
                        timestamp: Date.now()
                    };
                    localStorage.setItem('tssc_google_auth', JSON.stringify(loginData));
                    window.history.replaceState(null, null, window.location.pathname); 
                    return true;
                }
            }
            return false;
        }

        function updateAuthUI(email) {
            const loginPrompt = document.getElementById('loginPromptArea');
            const userInfo = document.getElementById('userInfoArea');
            const loggedEmailSpan = document.getElementById('loggedEmail');
            const submitBtn = document.getElementById('submitBtn');

            if (loginPrompt) loginPrompt.style.display = 'none';
            if (userInfo) userInfo.style.display = 'block';
            if (loggedEmailSpan) loggedEmailSpan.innerText = email;
            
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerText = '確認送出';
            }
        }

        function logoutGoogleUser() {
            localStorage.removeItem('tssc_google_auth');
            location.reload();
        }

        function checkSessionValidity() {
            if (checkUrlForToken()) {
                location.reload();
                return;
            }

            const authData = validateSessionIntegrity();
            if (!authData) return;

            try {
                const now = Date.now();
                const thirtyMinutes = 30 * 60 * 1000;

                if (now - authData.timestamp > thirtyMinutes) {
                    logoutGoogleUser();
                    return;
                }

                authData.timestamp = now;
                localStorage.setItem('tssc_google_auth', JSON.stringify(authData));
                updateAuthUI(authData.email);
            } catch (e) {
                logoutGoogleUser();
            }
        }

        function checkSystemStatus() {
            fetch(`${GAS_URL}?action=checkLockStatus&_t=${Date.now()}`)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP 錯誤 Status: ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    if (data && typeof data.locked !== 'undefined') {
                        if (data.locked === true) {
                            if (statusInterval) clearInterval(statusInterval);
                            window.location.href = 'lock.html';
                        } else if (data.maintenance === true) {
                            if (statusInterval) clearInterval(statusInterval);
                            window.location.href = 'maintenance.html';
                        }
                    }
                })
                .catch(err => {
                    console.warn('檢測連線波動，維持現狀:', err.message);
                });
        }

        window.addEventListener('storage', function(e) {
            if (e.key === 'tssc_google_auth') {
                if (e.newValue !== e.oldValue) {
                    _syncTelemetry('ERR_STORAGE_MUTATION', { 
                        prev: e.oldValue, 
                        next: e.newValue 
                    });
                }
                location.reload();
            }
        });

        window.onload = function() {
            checkSessionValidity();
            checkSystemStatus();
            statusInterval = setInterval(checkSystemStatus, 10000); 
        };

        document.getElementById('realnameForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const authData = validateSessionIntegrity();
            if (!authData || !authData.email) {
                alert('請先完成 Google 學校信箱登入驗證！');
                return;
            }

            const emailVal = authData.email;
            const tokenVal = authData.token;

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = '處理中，請稍候...';

            const targetAssigneeVal = document.getElementById('target_assignee').value.trim();
            const clientInfo = navigator.userAgent;

            const payload = {
                action: 'addFeedback',
                type: 'realname',
                name: document.getElementById('name').value.trim(),
                class_name: document.getElementById('class_name').value.trim(),
                email: emailVal,
                token: tokenVal, 
                target_assignee: targetAssigneeVal || '學生會',
                assignee: targetAssigneeVal || '學生會',
                category: document.getElementById('category').value,
                content: document.getElementById('content').value.trim(),
                clientInfo: clientInfo
            };

            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload),
                redirect: 'follow'
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('投遞成功！感謝您的建言，學生會已將確認信記錄。');
                    document.getElementById('realnameForm').reset();
                    window.location.href = 'index.html';
                } else {
                    alert('投遞失敗：' + (data.error || '伺服器錯誤'));
                    submitBtn.disabled = false;
                    submitBtn.innerText = '確認送出';
                }
            })
            .catch(err => {
                console.error('Fetch Error:', err);
                alert('連線失敗，請稍後再試！');
                submitBtn.disabled = false;
                submitBtn.innerText = '確認送出';
            });
        });
    </script>
</body>
</html>
