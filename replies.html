<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' https://tssc13th.github.io data:;">

    <title> 匿名意見回覆專區 - TSSC13TH 胡台校意見箱</title>
    <link rel="icon" type="image/png" href="tsscblack.png">
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
        }

        .navbar {
            width: 100%;             
            background-color: #ffffff;
            border-bottom: 1px solid #e5e7eb; 
            padding: 0.8rem 0;
            box-shadow: none;       
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between; 
            align-items: center;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #111827;
            font-weight: 700;
            font-size: 1.15rem;
            gap: 10px;
        }

        .site-logo {
            height: 32px;       
            width: auto;        
            object-fit: contain;
            vertical-align: middle;
            filter: brightness(0);
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-pill-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            padding: 0.45rem 0.9rem;
            font-size: 0.88rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s ease;
            cursor: pointer;
            background-color: #f8fafc;
            color: #475569;
            border: 1px solid #e2e8f0;
        }

        .nav-pill-btn:hover {
            background-color: #f1f5f9;
            color: #1e293b;
            border-color: #cbd5e1;
        }

        .nav-pill-btn.active {
            background-color: #eff6ff;
            color: #2563eb;
            border-color: #bfdbfe;
        }

        .hamburger-btn, .close-drawer-btn, .drawer-overlay {
            display: none;
        }

        .search-container {
            margin-bottom: 16px;
        }
        .search-input {
            width: 100%;
            padding: 12px 18px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .search-input:focus {
            border-color: black;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.15);
        }

        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #cbd5e1;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            color: #64748b;
            transition: all 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: black;
            color: white;
            border-color: black;
        }
        .public-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border-left: 5px solid #16a34a;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #e2e8f0;
        }
        .tag-category {
            background: #fef3c7;
            color: #92400e;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .tag-assignee {
            background: #f1f5f9;
            color: #475569;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-left: 6px;
        }
        .question-box {
            background: #f8fafc;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 14px;
            color: #334155;
        }
        .reply-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 14px;
            border-radius: 10px;
            color: #166534;
        }

        @media screen and (max-width: 768px) {
            .navbar .nav-container {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 16px;
                position: relative;
            }

            .hamburger-btn {
                display: inline-flex !important;
                align-items: center;
                justify-content: center;
                background: transparent;
                border: none;
                font-size: 1.5rem;
                color: #1e293b;
                cursor: pointer;
                padding: 4px;
            }

            .navbar .nav-brand {
                font-size: 0.95rem;
                gap: 6px;
                flex: 1;
                margin-left: 10px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .navbar .site-logo {
                width: 32px;
                height: auto;
            }

            .nav-menu, .nav-links {
                position: fixed;
                top: 0;
                left: -280px;
                width: 260px;
                height: 100vh;
                background-color: #ffffff !important;
                box-shadow: 4px 0 15px rgba(0, 0, 0, 0.15);
                z-index: 2000 !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: flex-start !important;
                align-items: stretch !important;
                padding: 20px !important;
                gap: 12px !important;
                transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .nav-menu.open, .nav-links.open {
                left: 0 !important;
            }

            .drawer-header {
                display: flex !important;
                justify-content: space-between !important;
                align-items: center !important;
                padding-bottom: 12px;
                margin-bottom: 8px;
                border-bottom: 1px solid #e2e8f0;
                width: 100%;
            }

            .drawer-title {
                font-size: 1.1rem;
                font-weight: 700;
                color: #1e293b;
            }

            .close-drawer-btn {
                display: block !important;
                position: static !important;
                background: transparent;
                border: none;
                font-size: 1.4rem;
                color: #64748b;
                cursor: pointer;
                padding: 2px 6px;
            }

            .nav-menu .nav-pill-btn, .nav-links .nav-item {
                width: 100% !important;
                display: flex !important;
                text-align: left !important;
                padding: 12px 16px !important;
                font-size: 1rem !important;
                justify-content: flex-start !important;
                color: #475569 !important;
                background-color: #f8fafc !important;
                border: 1px solid #e2e8f0 !important;
                border-radius: 8px !important;
                white-space: nowrap;
                cursor: pointer !important;
                text-decoration: none;
            }

            .nav-menu .nav-pill-btn.active, .nav-links .nav-item.active {
                background-color: #eff6ff !important;
                color: #2563eb !important;
                border-color: #bfdbfe !important;
            }

            .container, .admin-header-bar, #admin-dashboard {
                padding: 0 12px;
                margin: 10px auto 20px;
            }

            .feedback-form, .form-card, .card, .login-card, .info-section {
                padding: 20px 16px;
                border-radius: 12px;
                margin: 10px auto;
            }

            .form-group input,
            .form-group select,
            .form-group textarea {
                font-size: 16px !important; 
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    
    <nav class="navbar">
        <div class="nav-container">
            <button class="hamburger-btn" onclick="toggleDrawer()" aria-label="開啟選單">
                ☰
            </button>

            <a href="index.html" class="nav-brand">
                <img src="tpshcmcsc.png" alt="會徽" class="site-logo">
                <span class="brand-text">TSSC13TH 胡台校意見箱</span>
            </a>

            <div class="nav-menu" id="navDrawer">
                <div class="drawer-header">
                    <span class="drawer-title">TSSC意見箱</span>
                    <button type="button" class="close-drawer-btn" onclick="toggleDrawer()" aria-label="關閉選單">✕</button>
                </div>
                <a href="index.html" class="nav-pill-btn">首頁與須知</a>
                <a href="replies.html" class="nav-pill-btn active">匿名回覆專區</a>
                <a href="myreplies.html" class="nav-pill-btn">我的實名回覆</a>
            </div>
        </div>
    </nav>

    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>

    <header class="hero-header" style="text-align: center; padding: 30px 20px 10px;">
        <h1 style="color: #1e293b; margin-top: 5px;"> 學生會匿名回覆專區</h1>
        <p style="color: #64748b; margin-top: 6px;">感謝同學的寶貴建言，以下為學生會已處理與回覆之案件</p>
    </header>

    <main class="container" style="display: block; max-width: 900px; margin: 20px auto; padding: 0 20px;">
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="輸入關鍵字搜尋建言或回覆內容..." oninput="handleSearch()">
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterData('all', event)">全部類別</button>
            <button class="filter-btn" onclick="filterData('校園設施', event)">校園設施</button>
            <button class="filter-btn" onclick="filterData('活動建議', event)">活動建議</button>
            <button class="filter-btn" onclick="filterData('權益爭取', event)">權益爭取</button>
            <button class="filter-btn" onclick="filterData('其他', event)">其他</button>
        </div>

        <div id="public-reply-list">
            <p style="text-align:center; color:#94a3b8; padding:40px;">正在載入回覆紀錄...</p>
        </div>
    </main>

    <footer style="text-align: center; padding: 20px; color: #94a3b8; font-size: 0.88rem;">
        <p>胡志明市台灣學校學生會 TSSC13TH © 2026 yucheng</p>
    </footer>

    <script>
        function toggleDrawer() {
            const drawer = document.getElementById('navDrawer');
            if (drawer) {
                drawer.classList.toggle('open');
            }
        }

        document.addEventListener('click', function(event) {
            const drawer = document.getElementById('navDrawer');
            const hamburgerBtn = document.querySelector('.hamburger-btn');

            if (drawer && drawer.classList.contains('open')) {
                if (!drawer.contains(event.target) && !hamburgerBtn.contains(event.target)) {
                    drawer.classList.remove('open');
                }
            }
        });

        
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzXm5TiQss1GUKkDF4TOZJMqAeraA63vrpecSEzAuIvcNOvGjF51HFWnNutWc1Mjx4f/exec';
        let allReplies = [];
        let currentCategory = 'all';
        let statusInterval = null;

        function checkSystemStatus() {
            fetch(`${GAS_URL}?action=checkLockStatus&_t=${Date.now()}`)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP 錯誤 Status: ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    if (data && typeof data.locked !== 'undefined') {
                        if (data.locked === true) {
                            if (statusInterval) clearInterval(statusInterval);
                            window.location.href = 'lock.html';
                        } else if (data.maintenance === true) {
                            if (statusInterval) clearInterval(statusInterval);
                            window.location.href = 'maintenance.html';
                        }
                    }
                })
                .catch(err => {
                    console.warn('檢測連線波動，維持現狀:', err.message);
                });
        }

        function loadPublicReplies() {
            fetch(`${GAS_URL}?action=getPublicReplies&_t=${Date.now()}`)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    if (data && data.status === 'locked') {
                        document.getElementById('public-reply-list').innerHTML = '';
                        checkSystemStatus();
                        return;
                    }
                    allReplies = Array.isArray(data) ? data : (data.data || []);
                    applyFilters();
                })
                .catch(err => {
                    console.error('Fetch 失敗詳情：', err);
                    document.getElementById('public-reply-list').innerHTML = 
                        `<p style="text-align:center; color:#ef4444; padding:40px;">
                            載入失敗：${err.message || '無法連線至伺服器'}<br>
                            <small style="color:#94a3b8;">請確認 Google Apps Script 部署設定是否開放給「所有人 (Anyone)」</small>
                         </p>`;
                });
        }

        window.onload = function() {
            checkSystemStatus();
            loadPublicReplies();
            statusInterval = setInterval(checkSystemStatus, 10000); 
        };

        function applyFilters() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

            const filtered = allReplies.filter(item => {
                const matchCategory = (currentCategory === 'all') || (item.category === currentCategory);
                
                const contentText = (item.content || '').toLowerCase();
                const replyText = (item.reply_content || '').toLowerCase();
                const matchKeyword = !keyword || contentText.includes(keyword) || replyText.includes(keyword);

                return matchCategory && matchKeyword;
            });

            renderReplies(filtered);
        }

        function handleSearch() {
            applyFilters();
        }

        function filterData(category, event) {
            currentCategory = category;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }
            applyFilters();
        }

        function renderReplies(data) {
            const container = document.getElementById('public-reply-list');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:40px;">沒有找到符合條件的匿名意見紀錄。</p>';
                return;
            }

            container.innerHTML = data.map(item => {
                const timeText = item.created_at ? new Date(item.created_at).toLocaleString('zh-TW') : '';
                const assigneeText = item.target_assignee || item.assignee || '學生會';

                return `
                    <div class="public-card">
                        <div class="card-header">
                            <div>
                                <span class="tag-category">${escapeHTML(item.category || '一般')}</span>
                                <span class="tag-assignee">負責處理：${escapeHTML(assigneeText)}</span>
                            </div>
                            <small style="color:#94a3b8;">${escapeHTML(timeText)}</small>
                        </div>

                        <div class="question-box">
                            <strong> 同學建言：</strong>
                            <p style="margin-top:6px; white-space: pre-line;">${escapeHTML(item.content || '')}</p>
                        </div>

                        <div class="reply-box">
                            <strong> 學生會回覆：</strong>
                            <p style="margin-top:6px; white-space: pre-line;">${escapeHTML(item.reply_content || '')}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
</html>
